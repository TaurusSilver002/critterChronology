# ============================================================================
# CRITTER CHRONOLOGER - POSTGRESQL PRODUCTION CONFIGURATION
# ============================================================================
# 
# This configuration file sets up PostgreSQL database connectivity for the
# Critter Chronologer pet care scheduling application in production mode.
# 
# For testing, see: src/test/resources/application-test.properties
# ============================================================================

# ============================================================================
# SERVER CONFIGURATION
# ============================================================================

# Server Port Configuration
# Sets the port on which the Spring Boot application will run
# Port 8082 is used to avoid conflicts with other services on standard ports
# Can be overridden with: server.port=${PORT:8082} for cloud deployments
server.port=8082

# ============================================================================
# DATABASE CONNECTION CONFIGURATION
# ============================================================================

# PostgreSQL Database Connection URL
# Format: jdbc:postgresql://[host]:[port]/[database]
# - Protocol: jdbc:postgresql (PostgreSQL JDBC driver protocol)
# - Host: localhost (database server location - change for remote servers)
# - Port: 5432 (standard PostgreSQL port - change if using custom port)
# - Database: critterdb (our application database name)
spring.datasource.url=jdbc:postgresql://localhost:5432/critterdb

# PostgreSQL JDBC Driver Class
# This driver enables Java applications to communicate with PostgreSQL
# The driver is automatically included via the Maven dependency in pom.xml
spring.datasource.driver-class-name=org.postgresql.Driver

# Database Authentication Credentials
# OPTION 1: Using Docker PostgreSQL credentials (matches docker-compose.yml)
# Username: critter_user (application user created by Docker)
# Password: postgres_admin_123 (password set in Docker environment)
spring.datasource.username=critter_user
spring.datasource.password=postgres_admin_123

# OPTION 2: Using dedicated application user (recommended for production)
# Uncomment the following lines and comment out the postgres credentials above
# This uses the user created by the setup_database.sql script
# spring.datasource.username=critter_user
# spring.datasource.password=critter_password_123

# SECURITY NOTE: In production environments, use environment variables:
# spring.datasource.username=${DB_USERNAME:postgres}
# spring.datasource.password=${DB_PASSWORD:password}

# ============================================================================
# HIBERNATE ORM CONFIGURATION
# ============================================================================

# DDL (Data Definition Language) Auto Strategy
# Controls how Hibernate manages database schema:
# - create: Drop and recreate schema on every startup (DANGEROUS - loses data!)
# - create-drop: Create schema on startup, drop on shutdown (for testing)
# - update: Update existing schema to match entities (RECOMMENDED for development)
# - validate: Only validate schema matches entities, no changes (production safe)
# - none: No automatic schema management (manual control)
# CHANGED: Using create-drop for clean database state on each run (good for testing)
spring.jpa.hibernate.ddl-auto=create-drop

# PostgreSQL Database Dialect
# Tells Hibernate which SQL dialect to use for PostgreSQL-specific optimizations:
# - Enables PostgreSQL-specific SQL features (arrays, JSON, JSONB, etc.)
# - Optimizes SQL generation for PostgreSQL query planner
# - Handles PostgreSQL-specific data types correctly (UUID, TIMESTAMP, etc.)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Data Initialization Timing
# When set to true, Spring Boot will wait for Hibernate to create the schema
# before running data.sql initialization scripts. This ensures tables exist
# before trying to insert initial data. Critical for proper startup sequence.
spring.jpa.defer-datasource-initialization=true

# ============================================================================
# SQL LOGGING AND DEBUGGING (Development Settings)
# ============================================================================

# Show Generated SQL Statements
# Displays all SQL queries generated by Hibernate in the console
# Useful for debugging, performance analysis, and learning
# PERFORMANCE NOTE: Disable in production for better performance
spring.jpa.show-sql=true

# Format SQL for Readability
# Pretty-prints SQL statements with proper indentation and line breaks
# Makes debugging much easier during development
# Works in conjunction with show-sql to display readable queries
spring.jpa.properties.hibernate.format_sql=true

# Log SQL Parameter Values (Optional - Uncomment for detailed debugging)
# Shows the actual values being bound to SQL parameters (?, ?, etc.)
# SECURITY WARNING: This may log sensitive data like passwords - disable in production!
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Log Hibernate Statistics (Optional - Uncomment for performance monitoring)
# Provides detailed statistics about Hibernate operations
# logging.level.org.hibernate.stat=DEBUG
# spring.jpa.properties.hibernate.generate_statistics=true

# ============================================================================
# CONNECTION POOL CONFIGURATION (HikariCP)
# ============================================================================

# HikariCP is the default connection pool in Spring Boot 2.x+
# It provides high-performance database connection management

# Maximum Pool Size
# Maximum number of connections that can be created in the pool
# Higher values allow more concurrent database operations but use more resources
# Formula: (core_count * 2) + effective_spindle_count
# For development: 10 connections is usually sufficient
spring.datasource.hikari.maximum-pool-size=10

# Minimum Idle Connections
# Number of connections to keep alive even when not in use
# Ensures quick response times by avoiding connection creation overhead
# Should be less than or equal to maximum-pool-size
spring.datasource.hikari.minimum-idle=5

# Connection Timeout (milliseconds)
# Maximum time to wait for a connection from the pool before throwing exception
# 30 seconds = 30,000 milliseconds (reasonable for web applications)
spring.datasource.hikari.connection-timeout=30000

# Maximum Connection Lifetime (milliseconds)
# Maximum time a connection can stay in the pool before being retired
# Prevents issues with database connection timeouts and network issues
# 30 minutes = 1,800,000 milliseconds
spring.datasource.hikari.max-lifetime=1800000

# Idle Timeout (milliseconds)
# Time a connection can sit idle before being removed from pool
# Balances resource usage with connection availability
# 10 minutes = 600,000 milliseconds
spring.datasource.hikari.idle-timeout=600000

# Pool Name (Optional - for monitoring and debugging)
# Gives a custom name to the connection pool for easier identification in logs
spring.datasource.hikari.pool-name=CritterHikariPool

# ============================================================================
# JPA/HIBERNATE PERFORMANCE OPTIMIZATION
# ============================================================================

# JDBC Batch Processing
# Groups multiple INSERT/UPDATE/DELETE statements together for better performance
# Reduces network round-trips to the database
spring.jpa.properties.hibernate.jdbc.batch_size=25

# Order SQL Operations
# Optimizes batch processing by ordering similar operations together
# Improves batch efficiency and reduces lock contention
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# JDBC Fetch Size
# Number of rows to fetch from database in a single round trip
# Balances memory usage with network efficiency
spring.jpa.properties.hibernate.jdbc.fetch_size=50

# ============================================================================
# SPRING BOOT DATASOURCE INITIALIZATION
# ============================================================================

# SQL Script Initialization Mode
# Controls when Spring Boot runs schema.sql and data.sql files
# - always: Always run initialization scripts on startup
# - embedded: Only for embedded databases (H2, HSQL, Derby)
# - never: Never run initialization scripts
spring.sql.init.mode=always

# Continue on SQL Script Errors
# Whether to continue application startup if initialization scripts fail
# Set to false in production to catch initialization errors early
# Set to true in development if you have optional initialization scripts
spring.sql.init.continue-on-error=false

# SQL Script Encoding
# Character encoding for SQL script files (schema.sql, data.sql)
# UTF-8 ensures proper handling of international characters
spring.sql.init.encoding=UTF-8

# ============================================================================
# TRANSACTION MANAGEMENT
# ============================================================================

# Default Transaction Timeout (seconds)
# Maximum time a transaction can run before being automatically rolled back
# Prevents long-running transactions from blocking other operations
# 300 seconds = 5 minutes (adjust based on your application's needs)
spring.transaction.default-timeout=300

# Transaction Manager Type
# Spring Boot automatically configures JpaTransactionManager for JPA
# This is usually not needed to be set explicitly
# spring.jta.enabled=false

# ============================================================================
# ENVIRONMENT-SPECIFIC CONFIGURATION OVERRIDES
# ============================================================================

# The following properties can be overridden using:
# 
# 1. Environment Variables (highest priority):
#    - SPRING_DATASOURCE_URL
#    - SPRING_DATASOURCE_USERNAME  
#    - SPRING_DATASOURCE_PASSWORD
#    - SERVER_PORT
# 
# 2. JVM System Properties:
#    - -Dspring.datasource.url=jdbc:postgresql://prod-server:5432/critterdb
#    - -Dserver.port=8080
# 
# 3. External Configuration Files:
#    - application.properties in current directory
#    - application.properties in config/ subdirectory
# 
# 4. Spring Profiles:
#    - application-dev.properties (development)
#    - application-test.properties (testing - uses H2)
#    - application-prod.properties (production)
# 
# Example usage:
# java -jar critter.jar --spring.profiles.active=prod
# java -jar critter.jar --spring.datasource.password=prod_password

